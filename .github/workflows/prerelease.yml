name: Pre-release

# Every push to main runs the CI checks. When they pass, the commit is tagged
# v<version>-pre.<n> and published as a GitHub pre-release.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  prerelease:
    name: Tag and publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # One at a time, so two merges cannot compute the same tag.
    concurrency:
      group: prerelease
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag, to number this pre-release.
          fetch-depth: 0
      - name: Compute the tag
        id: next
        run: |
          # A re-run of this workflow must not tag the same commit twice.
          existing="$(git tag --points-at "$GITHUB_SHA" --list 'v*' | head -n 1)"
          if [ -n "$existing" ]; then
            echo "This commit is already tagged $existing. Nothing to publish."
            exit 0
          fi
          tag="$(node .github/scripts/next-prerelease.mjs)"
          echo "Next pre-release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create the tag and the pre-release
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --prerelease \
            --generate-notes
